<!DOCTYPE html>
<html lang="en">
{% include head.html %}
{% assign body_class = page.body_class | default: layout.body_class %}
<body{% if body_class %} class="{{ body_class }}"{% endif %}>

  <div class="wrapper">
    {{ content }}
  </div>
  {% if page.extra_js %}
    {% for script in page.extra_js %}
      <script src="{{ script | relative_url }}"></script>
    {% endfor %}
  {% endif %}

</body>
</html>
